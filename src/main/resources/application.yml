spring:
  application:
    name: tracking_order
  datasource:
    url: ${DBMS_CONNECTION:jdbc:mysql://localhost:3306/db_order}
    username: ${DBMS_USERNAME:root}
    password: ${DBMS_PASSWORD:250104}
  jpa:
    hibernate:
      ddl-auto: update
    database: mysql
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format-sql: true
    show-sql: true

  security:
    oauth2:
      resource-server:
        jwt:
          issuer-uri: http://localhost:8080/realms/demo-realm

jwt:
  secret: 
  issuer: vanchuonglam.com
  expiration: 3600000 # 1 hour in milliseconds
  refreshExpiration: 3600000 # 7 days in milliseconds

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

